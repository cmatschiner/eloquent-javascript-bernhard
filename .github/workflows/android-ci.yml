name: Android CI

on:
  push:
    branches: ["claude/meeting-recorder-app-tbiy08", "master"]
    paths: ["app/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake (native whisper.cpp)
        run: yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/**/*.gradle*', 'app/gradle/wrapper/gradle-wrapper.properties', 'app/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meetminutes-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Rename APK for release
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MeetMinutes-debug.apk

      - name: Publish APK as GitHub Release (direct download)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: MeetMinutes Debug (neueste)
          body: |
            Automatisch gebaute Debug-APK zum Testen am Smartphone (arm64-v8a, Android 12–16).
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/app/build/outputs/apk/debug/MeetMinutes-debug.apk
